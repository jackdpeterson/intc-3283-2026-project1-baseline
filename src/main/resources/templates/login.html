<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Sign in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topNav(${section})}"></nav>

<main class="container auth">
    <h1>Sign in</h1>

    <div th:if="${error}" class="alert alert-error" role="alert">
        <span th:text="${error}"></span>
        <a th:if="${showResend}" th:href="@{/verify-email/resend}">Send a new link</a>
    </div>
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>

    <!--/* Processed by Spring Security's form-login filter. th:action adds the CSRF field. */-->
    <form th:action="@{/login}" method="post" class="card form">
        <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <a th:href="@{/oauth2/authorization/google}" class="btn btn-block">Sign in with Google</a>

    <p class="muted center">No account yet? <a th:href="@{/register}">Register</a></p>
</main>

<footer th:replace="~{fragments/layout :: pageFooter}"></footer>
</body>
</html>
